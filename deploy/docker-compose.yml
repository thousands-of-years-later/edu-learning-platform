# ============================================================
# 智能广告基座学习平台 · Docker Compose 编排（若依 4.8.3）
# 服务：backend（若依 ruoyi-admin）+ mysql + redis + agent（Python 智能体）
# 用法：
#   首次部署：cp deploy/.env.example deploy/.env 并填写真实值
#   启动：    docker compose -f deploy/docker-compose.yml up -d
#   重建：    docker compose -f deploy/docker-compose.yml up -d --build
#   停止：    docker compose -f deploy/docker-compose.yml down
# ============================================================
services:
  mysql:
    image: mysql:8.0
    container_name: edu-mysql
    restart: unless-stopped
    # 日志轮转：单文件 50MB，最多 3 个，总计不超 150MB
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 deploy/.env 中配置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: learning_platform
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:6.2
    container_name: edu-redis
    restart: unless-stopped
    # 日志轮转：单文件 50MB，最多 3 个，总计不超 150MB
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    image: edu-learning-platform/backend:latest
    container_name: edu-backend
    restart: unless-stopped
    # 日志轮转：单文件 50MB，最多 3 个，总计不超 150MB
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 覆盖 application-druid.yml 默认值（容器内用服务名连接 MySQL）
      # 变量名用 LEARNING_DB_*，避免和宿主机/其他项目常见的 MYSQL_HOST 冲突
      LEARNING_DB_HOST: mysql
      LEARNING_DB_USER: ${MYSQL_USER:-edu_dev_03}
      LEARNING_DB_PASSWORD: ${MYSQL_PASSWORD:-12345678}
      UPLOAD_PATH: /home/ruoyi/uploadPath
      OSS_ENABLED: ${OSS_ENABLED:-false}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_BUCKET: ${OSS_BUCKET:-zhinengguanggaopingtai}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-oss-cn-shanghai.aliyuncs.com}
      OSS_URL_PREFIX: ${OSS_URL_PREFIX:-}
      # Python 智能体：容器内用服务名 agent 访问，不能用 127.0.0.1
      AGENT_BASE_URL: http://agent:8100
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:?请在 deploy/.env 中配置 AGENT_INTERNAL_TOKEN}
      TZ: Asia/Shanghai
    ports:
      - "${BACKEND_HOST_PORT:-8080}:80"
    volumes:
      - upload-data:/home/ruoyi/uploadPath
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
  agent:
    build:
      context: ../agent-service
      dockerfile: Dockerfile
    image: edu-learning-platform/agent:latest
    container_name: edu-agent
    restart: unless-stopped
    # 日志轮转：单文件 50MB，最多 3 个，总计不超 150MB
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    depends_on:
      mysql:
        condition: service_healthy
    # 模型 Key、OSS 凭据放在 agent-service/.env（不进 Git）
    env_file:
      - ../agent-service/.env
    environment:
      AGENT_PORT: "8100"
      # 容器内用服务名连 MySQL；edu_ro 只授 v_agent_* 视图 SELECT
      DB_READONLY_URL: mysql+pymysql://${AGENT_DB_USER:-edu_ro}:${AGENT_DB_PASSWORD:?请在 deploy/.env 中配置 AGENT_DB_PASSWORD}@mysql:3306/learning_platform?charset=utf8mb4
      # 与 Java 侧共用同一个内部令牌，避免两处配置漂移
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:?请在 deploy/.env 中配置 AGENT_INTERNAL_TOKEN}
      TZ: Asia/Shanghai
    ports:
      # 只绑宿主机回环，公网不可达；Java 容器内用 http://agent:8100
      - "127.0.0.1:${AGENT_HOST_PORT:-8100}:8100"
    volumes:
      # RAG 向量索引持久化，容器重建不丢
      - agent-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8100/internal/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
volumes:
  mysql-data:
  redis-data:
  upload-data:
  agent-data:
