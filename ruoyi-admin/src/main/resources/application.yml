# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 4.8.3
  # 版权年份
  copyrightYear: 2026
  # 实例演示开关
  demoEnabled: true
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: D:/ruoyi/uploadPath
  # 获取ip地址开关
  addressEnabled: false

# 文件存储配置
# 默认开启：新上传的文件写入 OSS；历史 /profile/** 本地文件仍可访问（不迁移）
# 临时回退本地存储时设 OSS_ENABLED=false（落盘 ruoyi.profile）
# 密钥只走环境变量：OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET，不要写进本文件
file:
  oss:
    # 开关：默认 true 写 OSS；OSS_ENABLED=false 时退回本地 D:/ruoyi/uploadPath
    enabled: ${OSS_ENABLED:true}
    # 地域节点：**不要带 https://**，访问前缀是按 https://{bucket}.{endpoint} 拼出来的
    endpoint: ${OSS_ENDPOINT:oss-cn-shanghai.aliyuncs.com}
    bucketName: ${OSS_BUCKET:zhinengguanggaopingtai}
    # 密钥只从环境变量读取，留空时首次上传会提示配置缺失
    accessKeyId: ${OSS_ACCESS_KEY_ID:}
    accessKeySecret: ${OSS_ACCESS_KEY_SECRET:}
    # Bucket 公共读时的访问前缀；留空则按 https://{bucket}.{endpoint} 自动推导
    # 当前配置的推导结果：https://zhinengguanggaopingtai.oss-cn-shanghai.aliyuncs.com
    urlPrefix: ${OSS_URL_PREFIX:}

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为80
  port: 80
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 上传视频时若超过限制，Tomcat 默认会中断连接导致前端只看到连接重置；
    # 关掉丢弃上限，让超限以正常的错误响应返回
    max-swallow-size: -1
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100
 
# 日志配置
logging:
  level:
    com.ruoyi: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码错误{maxRetryCount}次锁定10分钟
    maxRetryCount: 5

# Spring配置
spring:
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  # 模板引擎
  thymeleaf:
    mode: HTML
    encoding: utf-8
    # 禁用缓存
    cache: false
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: static/i18n/messages
  profiles:
    active: druid
  # 文件上传
  # 课程视频走 /common/upload，需要放宽到 200MB；
  # 与 ruoyi-common 的 FileUploadUtils.DEFAULT_MAX_SIZE 保持一致，改一个要改两个。
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 200MB
      # 设置总上传的文件大小
      max-request-size: 210MB

# MyBatis
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Shiro
shiro:
  user:
    # 登录地址
    loginUrl: /login
    # 权限认证失败地址
    unauthorizedUrl: /unauth
    # 首页地址
    indexUrl: /index
    # 验证码开关
    captchaEnabled: true
    # 验证码类型 math 数字计算 char 字符验证
    captchaType: math
  cookie:
    # 设置Cookie的域名 默认空，即当前访问的域名
    domain:
    # 设置cookie的有效访问路径
    path: /
    # 设置HttpOnly属性
    httpOnly: true
    # 设置Cookie的过期时间，天为单位
    maxAge: 30
    # 设置密钥，务必保持唯一性（生成方式，直接拷贝到main运行即可）Base64.encodeToString(CipherUtils.generateNewKey(128, "AES").getEncoded()) （默认启动生成随机秘钥，随机秘钥会导致之前客户端RememberMe Cookie无效，如设置固定秘钥RememberMe Cookie则有效）
    cipherKey:
  session:
    # Session超时时间，-1代表永不过期（默认30分钟）
    expireTime: 30
    # 同步session到数据库的周期（默认1分钟）
    dbSyncPeriod: 1
    # 相隔多久检查一次session的有效性，默认就是10分钟
    validationInterval: 10
    # 同一个用户最大会话数，比如2的意思是同一个账号允许最多同时两个人登录（默认-1不限制）
    maxSession: -1
    # 踢出之前登录的/之后登录的用户，默认踢出之前登录的用户
    kickoutAfter: false
  rememberMe:
    # 是否开启记住我
    enabled: true

# API Token 配置（/api/v1/** 用，令牌存 learning_api_token 表，见 sql/learning_api_token.sql）
api:
  token:
    # Token 有效期（天）。后台会话是 30 分钟，小程序不能动不动弹登录，所以给 30 天；
    # 改这里只影响【新签发】的 Token，已发出的按自己那行的 expire_time 走
    expireDays: 30

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: com.ruoyi.web.controller.tool

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice/*
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# 防止csrf攻击
csrf:
  # 过滤开关
  enabled: false
  # 白名单（多个用逗号分隔）
  whites: /druid
