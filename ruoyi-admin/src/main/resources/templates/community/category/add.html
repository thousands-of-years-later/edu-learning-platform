<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
	<th:block th:include="include :: header('新增社区类别')" />
</head>
<body class="white-bg">
	<div class="wrapper wrapper-content animated fadeInRight ibox-content">
		<form class="form-horizontal m" id="form-category-add">
			<!-- categoryType 是服务端强制覆盖的，这里只为满足 @NotBlank 校验，提交什么值都不影响 -->
			<input type="hidden" name="categoryType" value="article">
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">类别名称：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" name="categoryName" id="categoryName" required>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">显示顺序：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" name="orderNum" id="orderNum" required>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">状态：</label>
				<div class="col-sm-8">
				    <div class="radio-box" th:each="dict : ${@dict.getType('sys_normal_disable')}">
						<input type="radio" th:id="${dict.dictCode}" name="status" th:value="${dict.dictValue}" th:checked="${dict.default}">
						<label th:for="${dict.dictCode}" th:text="${dict.dictLabel}"></label>
					</div>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">备注：</label>
				<div class="col-sm-8">
					<textarea id="remark" name="remark" class="form-control"></textarea>
				</div>
			</div>
		</form>
	</div>
	<th:block th:include="include :: footer" />
	<script type="text/javascript">
		var prefix = ctx + "community/category";

		$("#form-category-add").validate({
			onkeyup: false,
			rules:{
				categoryName:{
					remote: {
		                url: ctx + "community/category/checkCategoryNameUnique",
		                type: "post",
		                dataType: "json",
		                data: {
		                	"categoryName" : function() {
		                        return $.common.trim($("#categoryName").val());
		                    }
		                }
		            }
				},
				orderNum:{
					digits:true
				},
			},
			messages: {
		        "categoryName": {
		            remote: "类别名称已经存在"
		        }
		    },
		    focusCleanup: true
		});

		function submitHandler() {
	        if ($.validate.form()) {
	        	$.operate.save(prefix + "/add", $('#form-category-add').serialize());
	        }
	    }
	</script>
</body>
</html>
