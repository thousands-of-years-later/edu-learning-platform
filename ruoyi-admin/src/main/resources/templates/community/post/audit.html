<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
	<th:block th:include="include :: header('帖子审核')" />
</head>
<body class="gray-bg">
	<div class="container-div">
		<div class="row">
			<div class="col-sm-12 search-collapse">
				<form id="post-form">
					<div class="select-list">
						<ul>
							<li>
								帖子标题：<input type="text" name="postTitle"/>
							</li>
							<li>
								类别：<select name="categoryId">
									<option value="">所有</option>
									<option th:each="c : ${categories}" th:text="${c.categoryName}" th:value="${c.categoryId}"></option>
								</select>
							</li>
							<li>
								<!-- 默认选中「待审核」：审核队列的视角；重置表单会恢复这个默认选中 -->
								状态：<select name="status" th:with="type=${@dict.getType('sys_post_status')}">
									<option value="">所有</option>
									<option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"
											th:selected="${dict.dictValue == '3'}"></option>
								</select>
							</li>
							<li>
								<a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
							    <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
							</li>
						</ul>
					</div>
				</form>
			</div>

			<!-- 审核页没有新增/删除/导出，保留空工具栏占位（ry-ui 的 table.toolbar 默认指向 #toolbar） -->
			<div class="btn-group-sm" id="toolbar" role="group"></div>

	        <div class="col-sm-12 select-table table-striped">
			    <table id="bootstrap-table"></table>
			</div>
		</div>
	</div>
	<th:block th:include="include :: footer" />
	<script th:inline="javascript">
		var auditFlag = /*[[${@permission.hasPermi('community:post:audit')}]]*/ "";
		var datas = /*[[${@dict.getType('sys_post_status')}]]*/ [];
		var prefix = ctx + "community/post";

		$(function() {
		    var options = {
		        url: prefix + "/auditList",
		        detailUrl: prefix + "/detail/{id}",
		        modalName: "帖子",
		        uniqueId: "postId",
		        /* 待审队列按提交时间倒序，先来先审 */
		        sortName: "postId",
		        sortOrder: "desc",
		        columns: [{
		            field: 'postId',
		            title: '编号',
		            sortable: true
		        },
		        {
		            field: 'postTitle',
		            title: '帖子标题',
		            sortable: true
		        },
		        {
		            field: 'categoryName',
		            title: '类别',
		            sortable: true
		        },
		        {
		            field: 'userName',
		            title: '作者',
		            sortable: true
		        },
		        {
		            field: 'status',
		            title: '状态',
		            align: 'center',
		            formatter: function(value, row, index) {
		            	var cls = value == '0' ? 'label-success' : (value == '1' ? 'label-info' : (value == '3' ? 'label-warning' : 'label-danger'));
		            	return '<span class="label ' + cls + '">' + $.table.selectDictLabel(datas, value) + '</span>';
		            }
		        },
		        {
		            field: 'isFeatured',
		            title: '精华',
		            align: 'center',
		            formatter: function(value, row, index) {
		            	return value == '1' ? '<span class="label label-warning">精华</span>' : '';
		            }
		        },
		        {
		            field: 'createTime',
		            title: '提交时间',
		            sortable: true
		        },
		        {
		            title: '操作',
		            align: 'center',
		            formatter: function(value, row, index) {
		                var actions = [];
		                actions.push('<a class="btn btn-primary btn-xs" href="javascript:void(0)" onclick="$.operate.detail(\'' + row.postId + '\')"><i class="fa fa-search"></i>详情</a> ');
		                /* 只有待审核的帖子能审核（服务端同样校验，这里只控制按钮显示） */
		                if (row.status == '3') {
		                	actions.push('<a class="btn btn-warning btn-xs ' + auditFlag + '" href="javascript:void(0)" onclick="openAudit(\'' + row.postId + '\')"><i class="fa fa-gavel"></i>审核</a>');
		                }
		                return actions.join('');
		            }
		        }]
		    };
		    $.table.init(options);
		});

		/* 审核表单在弹出层里打开，提交成功由 $.operate.successCallback 关闭弹窗并刷新本页表格 */
		function openAudit(postId) {
			$.modal.open('审核帖子', prefix + '/audit/' + postId, '800', '580');
		}
	</script>
</body>
</html>
