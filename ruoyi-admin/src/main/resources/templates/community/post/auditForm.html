<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
	<th:block th:include="include :: header('审核帖子')" />
</head>
<body class="white-bg">
	<div class="wrapper wrapper-content animated fadeInRight ibox-content">
		<form class="form-horizontal m" id="form-post-audit">
			<input name="postId" type="hidden" th:value="${post.postId}"/>
			<div class="form-group">
				<label class="col-sm-2 control-label">帖子标题：</label>
				<div class="col-sm-10">
					<p class="form-control-static" th:text="${post.postTitle}">-</p>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-2 control-label">作者 / 类别：</label>
				<div class="col-sm-10">
					<p class="form-control-static">
						<span th:text="${post.userName} ?: ${post.createBy}">-</span> /
						<span th:text="${post.categoryName} ?: '未分类'">-</span>
					</p>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-2 control-label">当前状态：</label>
				<div class="col-sm-10">
					<p class="form-control-static">
						<span class="label label-warning" th:text="${@dict.getLabel('sys_post_status', post.status)}">-</span>
						<a th:href="@{/community/post/detail/{id}(id=${post.postId})}" target="_blank" class="btn btn-link btn-xs">查看正文</a>
					</p>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-2 control-label is-required">审核结果：</label>
				<div class="col-sm-10">
					<!-- 刻意不预选：避免误点「确定」就把帖子直接发布出去；未选会被 submitHandler 拦住 -->
					<div class="radio-box">
						<input type="radio" id="auditPass" name="status" value="0"><label for="auditPass">通过</label>
					</div>
					<div class="radio-box">
						<input type="radio" id="auditReject" name="status" value="4"><label for="auditReject">驳回</label>
					</div>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-2 control-label">精华：</label>
				<div class="col-sm-10">
					<label class="checkbox-inline">
						<input type="checkbox" id="isFeatured" name="isFeatured" value="1"
							   th:checked="${post.isFeatured == '1'}"> 设为精华（仅通过时生效）
					</label>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-2 control-label">审核备注：</label>
				<div class="col-sm-10">
					<textarea id="auditRemark" name="auditRemark" class="form-control" rows="3"
							  placeholder="驳回时建议写明原因，作者可在编辑页与详情页看到"></textarea>
					<p class="help-block" th:if="${!#strings.isEmpty(post.auditRemark)}">
						上次审核备注：<span th:text="${post.auditRemark}">-</span></p>
				</div>
			</div>
		</form>
	</div>
	<th:block th:include="include :: footer" />
	<script type="text/javascript">
		var prefix = ctx + "community/post";

		$("#form-post-audit").validate({
			onkeyup: false,
			rules:{
				auditRemark:{
					maxlength: 500
				}
			},
		    focusCleanup: true
		});

		function submitHandler() {
			if ($("input[name='status']:checked").length == 0) {
				$.modal.alertWarning("请选择审核结果：通过或驳回");
				return;
			}
	        if ($.validate.form("form-post-audit")) {
	        	$.operate.save(prefix + "/audit", $('#form-post-audit').serialize());
	        }
	    }
	</script>
</body>
</html>
