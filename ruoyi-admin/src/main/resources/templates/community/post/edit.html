<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
	<th:block th:include="include :: header('修改帖子')" />
	<th:block th:include="include :: easymde-css" />
</head>
<body class="white-bg">
	<div class="wrapper wrapper-content animated fadeInRight ibox-content">
		<!-- 审核状态提示：驳回原因给作者看，改完重新选「已发布」提交即可 -->
		<div class="alert alert-danger" th:if="${post.status == '4' and !#strings.isEmpty(post.auditRemark)}">
			<i class="fa fa-exclamation-triangle"></i> 该帖子已被驳回，原因：<span th:text="${post.auditRemark}">-</span>
		</div>
		<div class="alert alert-danger" th:if="${post.status == '4' and #strings.isEmpty(post.auditRemark)}">
			<i class="fa fa-exclamation-triangle"></i> 该帖子已被驳回，请修改后选择「已发布」重新提交审核。
		</div>
		<div class="alert alert-info" th:if="${post.status == '3'}">
			<i class="fa fa-clock-o"></i> 该帖子正在审核中；修改内容后选择「已发布」会重新提交审核。
		</div>
		<form class="form-horizontal m" id="form-post-edit" th:object="${post}">
			<input id="postId" name="postId" type="hidden" th:field="*{postId}"/>
			<div class="form-group">
				<label class="col-sm-2 control-label is-required">帖子标题：</label>
				<div class="col-sm-10">
					<input class="form-control" type="text" name="postTitle" id="postTitle" th:field="*{postTitle}" required>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-2 control-label">所属类别：</label>
				<div class="col-sm-10">
					<select name="categoryId" class="form-control">
						<option value="">无</option>
						<option th:each="c : ${categories}" th:text="${c.categoryName}" th:value="${c.categoryId}"
								th:selected="${c.categoryId == post.categoryId}"></option>
					</select>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-2 control-label">正文：</label>
				<div class="col-sm-10">
					<!-- Markdown 原文；textarea 的既有内容会被 EasyMDE 当作初始值读取，
					     不用把正文拼进 JS 字面量 -->
					<textarea id="postContent" name="content" class="form-control" th:text="*{content}"></textarea>
				</div>
			</div>
			<div class="form-group" th:if="${isAdmin}">
				<label class="col-sm-2 control-label">点赞/收藏/评论：</label>
				<div class="col-sm-3">
					<input class="form-control" type="text" name="likeCount" id="likeCount" th:field="*{likeCount}">
				</div>
				<div class="col-sm-3">
					<input class="form-control" type="text" name="favoriteCount" id="favoriteCount" th:field="*{favoriteCount}">
				</div>
				<div class="col-sm-3">
					<input class="form-control" type="text" name="commentCount" id="commentCount" th:field="*{commentCount}">
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-2 control-label">状态：</label>
				<div class="col-sm-10">
					<!-- 普通用户看不到「已下架」，也重新发布不了已被管理员下架的帖子：
					     后端 PostServiceImpl.resolveStatus 会把状态强制保持为已下架。
					     「待审核 / 已驳回」只由审核链路流转，不给表单直选；
					     处于这两个状态的帖子这里没有预选 radio，保存前会要求显式选择 -->
					<div class="radio-box" th:each="dict : ${@dict.getType('sys_post_status')}"
						 th:if="${dict.dictValue != '3' and dict.dictValue != '4' and (isAdmin or dict.dictValue != '2')}">
						<input type="radio" th:id="${dict.dictCode}" name="status" th:value="${dict.dictValue}" th:field="*{status}">
						<label th:for="${dict.dictCode}" th:text="${dict.dictLabel}"></label>
					</div>
					<p class="help-block" th:if="${!isAdmin}">选择「已发布」会先提交管理员审核，审核通过才公开。</p>
				</div>
			</div>
			<div class="form-group" th:if="${isAdmin}">
				<label class="col-sm-2 control-label">精华：</label>
				<div class="col-sm-10">
					<!-- 不用 th:field：未勾选时浏览器不提交该字段，由控制层归一化成 '0' -->
					<label class="checkbox-inline">
						<input type="checkbox" id="isFeatured" name="isFeatured" value="1"
							   th:checked="${post.isFeatured == '1'}"> 设为精华
					</label>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-2 control-label">备注：</label>
				<div class="col-sm-10">
					<textarea id="remark" name="remark" class="form-control">[[*{remark}]]</textarea>
				</div>
			</div>
		</form>
	</div>
	<th:block th:include="include :: footer" />
	<th:block th:include="include :: easymde-js" />
	<script type="text/javascript">
		var prefix = ctx + "community/post";

		var easyMDE = new EasyMDE({
			element: document.getElementById('postContent'),
			/* 必须关闭：默认会去 CDN 拉 FontAwesome，内网/离线环境下工具栏图标会全空 */
			autoDownloadFontAwesome: false,
			placeholder: '支持 Markdown，图片可直接拖拽或粘贴上传',
			spellChecker: false,
			status: false,
			minHeight: '280px',
			/* 只保留文字与图片相关按钮，帖子不含视频 */
			toolbar: ['bold', 'italic', 'heading', '|', 'quote', 'unordered-list', 'ordered-list',
			          '|', 'link', 'image', '|', 'preview', 'side-by-side', 'fullscreen', '|', 'guide'],
			uploadImage: true,
			imageUploadFunction: function (file, onSuccess, onError) {
				var data = new FormData();
				data.append("file", file);
				$.ajax({
					type: "POST",
					url: ctx + "common/upload",
					data: data,
					cache: false,
					contentType: false,
					processData: false,
					dataType: 'json',
					success: function(result) {
						if (result.code == web_status.SUCCESS) {
							/* 存相对路径 /profile/...，不存绝对地址 */
							onSuccess(result.fileName);
						} else {
							onError(result.msg);
						}
					},
					error: function() {
						onError("图片上传失败。");
					}
				});
			},
			/* 正文是用户内容，渲染结果必须先过 DOMPurify，否则预览里就能执行脚本 */
			previewRender: function(plainText) {
				return DOMPurify.sanitize(marked.parse(plainText, { gfm: true, breaks: true }));
			}
		});

		$("#form-post-edit").validate({
			onkeyup: false,
			rules:{
				likeCount:{
					digits:true
				},
				favoriteCount:{
					digits:true
				},
				commentCount:{
					digits:true
				}
			},
		    focusCleanup: true
		});

		function submitHandler() {
			/* 待审核/已驳回的帖子没有预选状态；不显式选择时浏览器不提交 status，
			   后端会静默保持原状态，作者会以为"改完提交了"——这里直接拦住 */
			if ($("input[name='status']:checked").length == 0) {
				$.modal.alertWarning("请选择帖子状态：发布（提交审核）或草稿");
				return;
			}
			/* EasyMDE 不会把内容同步回 textarea，serialize 前必须手动写回 */
			$("#postContent").val(easyMDE.value());
	        if ($.validate.form()) {
	        	$.operate.save(prefix + "/edit", $('#form-post-edit').serialize());
	        }
	    }
	</script>
</body>
</html>
