<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
	<th:block th:include="include :: header('新增违禁词')" />
</head>
<body class="white-bg">
	<div class="wrapper wrapper-content animated fadeInRight ibox-content">
		<form class="form-horizontal m" id="form-word-add">
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">违禁词：</label>
				<div class="col-sm-8">
					<input name="word" class="form-control" type="text" maxlength="100" required>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">状态：</label>
				<div class="col-sm-8">
					<select name="status" class="form-control">
						<option value="0">正常</option>
						<option value="1">停用</option>
					</select>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">备注：</label>
				<div class="col-sm-8">
					<textarea name="remark" class="form-control" maxlength="255" rows="3"></textarea>
				</div>
			</div>
		</form>
	</div>
	<th:block th:include="include :: footer" />
	<script th:inline="javascript">
		var prefix = ctx + "community/sensitive-word";
		$("#form-word-add").validate({
			rules: {
				word: {
					required: true,
					maxlength: 100
				}
			},
			focusCleanup: true
		});

		function submitHandler() {
			if ($.validate.form()) {
				$.operate.save(prefix + "/add", $('#form-word-add').serialize());
			}
		}
	</script>
</body>
</html>
