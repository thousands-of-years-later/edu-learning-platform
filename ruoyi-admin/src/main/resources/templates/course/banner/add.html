<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
	<th:block th:include="include :: header('新增轮播图')" />
	<th:block th:include="include :: bootstrap-fileinput-css" />
</head>
<body class="white-bg">
	<div class="wrapper wrapper-content animated fadeInRight ibox-content">
		<form class="form-horizontal m" id="form-banner-add">
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">标题：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" name="title" id="title" required>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">所属类别：</label>
				<div class="col-sm-8">
					<!-- 0 = 「全部」窗口，是单独维护的一批数据，不是各类别的汇总 -->
					<select name="categoryId" class="form-control" required>
						<option value="0">全部</option>
						<option th:each="c : ${categories}" th:value="${c.categoryId}"
								th:text="${c.status == '1' ? c.categoryName + '（已停用）' : c.categoryName}"></option>
					</select>
					<div class="help-block">「全部」窗口的轮播可以挂任意课程；具体类别窗口只能挂该类别下的课程</div>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">轮播图片：</label>
				<div class="col-sm-8">
					<!-- 存上传接口返回的相对路径（/profile/...），不存绝对地址 -->
					<input type="hidden" id="imageUrl" name="imageUrl"/>
					<div class="file-loading">
						<input id="imageFile" name="file" type="file">
					</div>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">跳转课程：</label>
				<div class="col-sm-8">
					<!-- 选项带上课程所属类别，方便一眼看出跟「所属类别」是否匹配（不匹配会在保存时被拦下） -->
					<select name="courseId" class="form-control" required>
						<option value="">请选择</option>
						<option th:each="c : ${courses}" th:value="${c.courseId}"
								th:with="label=${(c.categoryName != null ? c.categoryName : '未归类') + (c.status == '1' ? '，已停用' : '')}"
								th:text="${c.courseName + '（' + label + '）'}"></option>
					</select>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">显示顺序：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" name="orderNum" id="orderNum" value="0">
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">状态：</label>
				<div class="col-sm-8">
				    <div class="radio-box" th:each="dict : ${@dict.getType('sys_normal_disable')}">
						<input type="radio" th:id="${dict.dictCode}" name="status" th:value="${dict.dictValue}" th:checked="${dict.default}">
						<label th:for="${dict.dictCode}" th:text="${dict.dictLabel}"></label>
					</div>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">备注：</label>
				<div class="col-sm-8">
					<textarea id="remark" name="remark" class="form-control"></textarea>
				</div>
			</div>
		</form>
	</div>
	<th:block th:include="include :: footer" />
	<th:block th:include="include :: bootstrap-fileinput-js" />
	<script type="text/javascript">
		var prefix = ctx + "course/banner";

		$("#imageFile").fileinput({
            uploadUrl: ctx + 'common/upload',
            maxFileCount: 1,
            autoReplace: true,
            allowedFileExtensions: ['jpg', 'jpeg', 'png'],
            showPreview: true
        }).on('fileuploaded', function (event, data, previewId, index) {
        	var rsp = data.response;
            if (rsp.code == 0) {
            	$("#imageUrl").val(rsp.fileName);
            } else {
            	$.modal.alertError(rsp.msg);
            }
        }).on('fileremoved', function () {
            $("#imageUrl").val('');
        });

		$("#form-banner-add").validate({
			onkeyup: false,
			rules:{
				orderNum:{
					digits:true
				}
			},
		    focusCleanup: true
		});

		function submitHandler() {
			if ($.common.isEmpty($("#imageUrl").val())) {
				$.modal.msgWarning("请先上传轮播图片");
				return false;
			}
	        if ($.validate.form()) {
	        	$.operate.save(prefix + "/add", $('#form-banner-add').serialize());
	        }
	    }
	</script>
</body>
</html>
