<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
	<th:block th:include="include :: header('修改轮播图')" />
	<th:block th:include="include :: bootstrap-fileinput-css" />
</head>
<body class="white-bg">
	<div class="wrapper wrapper-content animated fadeInRight ibox-content">
		<form class="form-horizontal m" id="form-banner-edit" th:object="${banner}">
			<input id="bannerId" name="bannerId" type="hidden" th:field="*{bannerId}"/>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">标题：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" name="title" id="title" th:field="*{title}" required>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">所属类别：</label>
				<div class="col-sm-8">
					<!-- 0 = 「全部」窗口；停用的类别也要列出来，否则选不回原值 -->
					<select name="categoryId" class="form-control" required>
						<option value="0" th:selected="${banner.categoryId == 0}">全部</option>
						<option th:each="c : ${categories}" th:value="${c.categoryId}"
								th:text="${c.status == '1' ? c.categoryName + '（已停用）' : c.categoryName}"
								th:selected="${c.categoryId == banner.categoryId}"></option>
					</select>
					<div class="help-block">「全部」窗口的轮播可以挂任意课程；具体类别窗口只能挂该类别下的课程</div>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">轮播图片：</label>
				<div class="col-sm-8">
					<!-- 已有图片时这里是旧地址，重新上传会覆盖；不清空就保持原值 -->
					<input type="hidden" id="imageUrl" name="imageUrl" th:field="*{imageUrl}"/>
					<div class="file-loading">
						<input id="imageFile" name="file" type="file">
					</div>
					<div class="help-block" th:if="${banner.imageUrl != null and banner.imageUrl != ''}">
						当前图片：<img th:src="${banner.imageUrl}" style="height:40px"/>
					</div>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">跳转课程：</label>
				<div class="col-sm-8">
					<!-- 停用的课程也要列出来：过滤掉会导致编辑页选不回原值，改个标题都存不了 -->
					<select name="courseId" class="form-control" required>
						<option value="">请选择</option>
						<option th:each="c : ${courses}" th:value="${c.courseId}"
								th:with="label=${(c.categoryName != null ? c.categoryName : '未归类') + (c.status == '1' ? '，已停用' : '')}"
								th:text="${c.courseName + '（' + label + '）'}"
								th:selected="${c.courseId == banner.courseId}"></option>
					</select>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">显示顺序：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" name="orderNum" id="orderNum" th:field="*{orderNum}">
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">状态：</label>
				<div class="col-sm-8">
					<div class="radio-box" th:each="dict : ${@dict.getType('sys_normal_disable')}">
						<input type="radio" th:id="${dict.dictCode}" name="status" th:value="${dict.dictValue}" th:field="*{status}">
						<label th:for="${dict.dictCode}" th:text="${dict.dictLabel}"></label>
					</div>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">备注：</label>
				<div class="col-sm-8">
					<textarea id="remark" name="remark" class="form-control">[[*{remark}]]</textarea>
				</div>
			</div>
		</form>
	</div>
	<th:block th:include="include :: footer" />
	<th:block th:include="include :: bootstrap-fileinput-js" />
	<script type="text/javascript">
		var prefix = ctx + "course/banner";

		$("#imageFile").fileinput({
            uploadUrl: ctx + 'common/upload',
            maxFileCount: 1,
            autoReplace: true,
            allowedFileExtensions: ['jpg', 'jpeg', 'png'],
            showPreview: true
        }).on('fileuploaded', function (event, data, previewId, index) {
        	var rsp = data.response;
            if (rsp.code == 0) {
            	$("#imageUrl").val(rsp.fileName);
            } else {
            	$.modal.alertError(rsp.msg);
            }
        });

		$("#form-banner-edit").validate({
			onkeyup: false,
			rules:{
				orderNum:{
					digits:true
				}
			},
		    focusCleanup: true
		});

		function submitHandler() {
			if ($.common.isEmpty($("#imageUrl").val())) {
				$.modal.msgWarning("请先上传轮播图片");
				return false;
			}
	        if ($.validate.form()) {
	        	$.operate.save(prefix + "/edit", $('#form-banner-edit').serialize());
	        }
	    }
	</script>
</body>
</html>
