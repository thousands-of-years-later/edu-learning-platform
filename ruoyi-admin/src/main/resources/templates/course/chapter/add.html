<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
	<th:block th:include="include :: header('新增课程章节')" />
</head>
<body class="white-bg">
	<div class="wrapper wrapper-content animated fadeInRight ibox-content">
		<form class="form-horizontal m" id="form-chapter-add">
			<!-- 章节归属的课程由列表页一路带过来，页面上不可改 -->
			<input type="hidden" id="courseId" name="courseId" th:value="${courseId}"/>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">章节标题：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" name="chapterTitle" id="chapterTitle" required>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">章节内容：</label>
				<div class="col-sm-8">
					<textarea id="chapterContent" name="chapterContent" class="form-control" rows="5"></textarea>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">显示顺序：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" name="orderNum" id="orderNum" value="0">
				</div>
			</div>
		</form>
	</div>
	<th:block th:include="include :: footer" />
	<script type="text/javascript">
		var prefix = ctx + "course/chapter";

		$("#form-chapter-add").validate({
			onkeyup: false,
			rules:{
				orderNum:{
					digits:true
				}
			},
		    focusCleanup: true
		});

		function submitHandler() {
	        if ($.validate.form()) {
	        	$.operate.save(prefix + "/add", $('#form-chapter-add').serialize());
	        }
	    }
	</script>
</body>
</html>
