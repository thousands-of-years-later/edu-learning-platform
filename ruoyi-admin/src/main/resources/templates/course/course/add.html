<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
	<th:block th:include="include :: header('新增课程')" />
	<th:block th:include="include :: bootstrap-fileinput-css" />
</head>
<body class="white-bg">
	<div class="wrapper wrapper-content animated fadeInRight ibox-content">
		<form class="form-horizontal m" id="form-course-add">
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">课程名称：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" name="courseName" id="courseName" required>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">所属类别：</label>
				<div class="col-sm-8">
					<select name="categoryId" class="form-control">
						<option value="">无</option>
						<option th:each="c : ${categories}" th:text="${c.categoryName}" th:value="${c.categoryId}"></option>
					</select>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">封面图片：</label>
				<div class="col-sm-8">
					<!-- 存上传接口返回的相对路径（/profile/...），不存绝对地址 -->
					<input type="hidden" id="coverUrl" name="coverUrl"/>
					<div class="file-loading">
						<input id="coverFile" name="file" type="file">
					</div>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">课程简介：</label>
				<div class="col-sm-8">
					<textarea id="intro" name="intro" class="form-control"></textarea>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">点赞/收藏/评论：</label>
				<div class="col-sm-3">
					<input class="form-control" type="text" name="likeCount" id="likeCount" value="0">
				</div>
				<div class="col-sm-3">
					<input class="form-control" type="text" name="favoriteCount" id="favoriteCount" value="0">
				</div>
				<div class="col-sm-2">
					<input class="form-control" type="text" name="commentCount" id="commentCount" value="0">
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">状态：</label>
				<div class="col-sm-8">
				    <div class="radio-box" th:each="dict : ${@dict.getType('sys_normal_disable')}">
						<input type="radio" th:id="${dict.dictCode}" name="status" th:value="${dict.dictValue}" th:checked="${dict.default}">
						<label th:for="${dict.dictCode}" th:text="${dict.dictLabel}"></label>
					</div>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">备注：</label>
				<div class="col-sm-8">
					<textarea id="remark" name="remark" class="form-control"></textarea>
				</div>
			</div>
		</form>
	</div>
	<th:block th:include="include :: footer" />
	<th:block th:include="include :: bootstrap-fileinput-js" />
	<script type="text/javascript">
		var prefix = ctx + "course/course";

		$("#coverFile").fileinput({
            uploadUrl: ctx + 'common/upload',
            maxFileCount: 1,
            autoReplace: true,
            allowedFileExtensions: ['jpg', 'jpeg', 'png'],
            showPreview: true
        }).on('fileuploaded', function (event, data, previewId, index) {
        	var rsp = data.response;
            if (rsp.code == 0) {
            	$("#coverUrl").val(rsp.fileName);
            } else {
            	$.modal.alertError(rsp.msg);
            }
        }).on('fileremoved', function () {
            $("#coverUrl").val('');
        });

		$("#form-course-add").validate({
			onkeyup: false,
			rules:{
				courseName:{
					remote: {
		                url: ctx + "course/course/checkCourseNameUnique",
		                type: "post",
		                dataType: "json",
		                data: {
		                	"courseName" : function() {
		                        return $.common.trim($("#courseName").val());
		                    }
		                }
		            }
				},
				likeCount:{
					digits:true
				},
				favoriteCount:{
					digits:true
				},
				commentCount:{
					digits:true
				}
			},
			messages: {
		        "courseName": {
		            remote: "课程名称已经存在"
		        }
		    },
		    focusCleanup: true
		});

		function submitHandler() {
			if ($.common.isEmpty($("#coverUrl").val())) {
				$.modal.msgWarning("请先上传封面图片");
				return false;
			}
	        if ($.validate.form()) {
	        	$.operate.save(prefix + "/add", $('#form-course-add').serialize());
	        }
	    }
	</script>
</body>
</html>
