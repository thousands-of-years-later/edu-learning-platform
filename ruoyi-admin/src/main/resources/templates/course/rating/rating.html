<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
	<th:block th:include="include :: header('评价管理')" />
</head>
<body class="gray-bg">
	<div class="container-div">
		<div class="row">
			<div class="col-sm-12 search-collapse">
				<form id="rating-form">
					<div class="select-list">
						<ul>
							<li>
								课程ID：<input type="text" name="courseId"/>
							</li>
							<li>
								评分：<select name="score">
									<option value="">所有</option>
									<option value="5">5 分</option>
									<option value="4">4 分</option>
									<option value="3">3 分</option>
									<option value="2">2 分</option>
									<option value="1">1 分</option>
								</select>
							</li>
							<li>
								评价内容：<input type="text" name="content"/>
							</li>
							<li>
								<a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
							    <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
							</li>
						</ul>
					</div>
				</form>
			</div>

			<div class="btn-group-sm" id="toolbar" role="group">
				<a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()" shiro:hasPermission="course:rating:remove">
		            <i class="fa fa-remove"></i> 删除
		        </a>
	        </div>

	        <div class="col-sm-12 select-table table-striped">
			    <table id="bootstrap-table"></table>
			</div>
		</div>
	</div>
	<th:block th:include="include :: footer" />
	<script th:inline="javascript">
		var removeFlag = /*[[${@permission.hasPermi('course:rating:remove')}]]*/ "";
		var prefix = ctx + "course/rating";

		$(function() {
		    var options = {
		        url: prefix + "/list",
		        removeUrl: prefix + "/remove",
		        modalName: "评价",
		        uniqueId: "ratingId",
		        sortName: "ratingId",
		        columns: [{
		            checkbox: true
		        },
		        {
		            field: 'ratingId',
		            title: '评价ID',
		            sortable: true
		        },
		        {
		            field: 'courseName',
		            title: '课程',
		            formatter: function(value, row, index) {
		                if (!value) { return '<span class="text-muted">（课程 ' + row.courseId + ' 已删除）</span>'; }
		                return $('<div/>').text(value).html();
		            }
		        },
		        {
		            field: 'userName',
		            title: '评分人'
		        },
		        {
		            field: 'score',
		            title: '评分',
		            align: 'center',
		            formatter: function(value, row, index) {
		                var s = Number(value) || 0;
		                return '<span class="text-warning">' + new Array(s + 1).join('★') + '</span>';
		            }
		        },
		        {
		            field: 'content',
		            title: '文字评价',
		            formatter: function(value, row, index) {
		                if (!value) { return '<span class="text-muted">（只打星）</span>'; }
		                var text = value.length > 60 ? value.substring(0, 60) + '…' : value;
		                return $('<div/>').text(text).html();
		            }
		        },
		        {
		            field: 'createTime',
		            title: '评价时间',
		            sortable: true
		        },
		        {
		            field: 'updateTime',
		            title: '最后修改'
		        },
		        {
		            title: '操作',
		            align: 'center',
		            formatter: function(value, row, index) {
		                var actions = [];
		                actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.ratingId + '\')"><i class="fa fa-remove"></i>删除</a>');
		                return actions.join('');
		            }
		        }]
		    };
		    $.table.init(options);
		});
	</script>
</body>
</html>
