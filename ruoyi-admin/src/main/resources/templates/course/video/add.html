<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
	<th:block th:include="include :: header('新增课程视频')" />
	<th:block th:include="include :: bootstrap-fileinput-css" />
</head>
<body class="white-bg">
	<div class="wrapper wrapper-content animated fadeInRight ibox-content">
		<form class="form-horizontal m" id="form-video-add">
			<!-- 视频归属的课程由列表页一路带过来，页面上不可改 -->
			<input type="hidden" id="courseId" name="courseId" th:value="${courseId}"/>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">视频标题：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" name="videoTitle" id="videoTitle" required>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">所属章节：</label>
				<div class="col-sm-8">
					<select name="chapterId" class="form-control">
						<option value="">无章节</option>
						<option th:each="c : ${chapters}" th:text="${c.chapterTitle}" th:value="${c.chapterId}"></option>
					</select>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">视频文件：</label>
				<div class="col-sm-8">
					<!-- 存上传接口返回的相对路径（/profile/...），不存绝对地址 -->
					<input type="hidden" id="videoUrl" name="videoUrl"/>
					<div class="file-loading">
						<input id="videoFile" name="file" type="file">
					</div>
					<div class="help-block">支持 mp4 / avi / rmvb，上传成功后地址自动填入</div>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">显示顺序：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" name="orderNum" id="orderNum" value="0">
				</div>
			</div>
		</form>
	</div>
	<th:block th:include="include :: footer" />
	<th:block th:include="include :: bootstrap-fileinput-js" />
	<script type="text/javascript">
		var prefix = ctx + "course/video";

		/* 视频不预览：bootstrap-fileinput 的预览会把整个文件读进浏览器内存，
		   几百 MB 的视频会直接把页面卡死，只留文件名即可 */
		$("#videoFile").fileinput({
            uploadUrl: ctx + 'common/upload',
            maxFileCount: 1,
            autoReplace: true,
            allowedFileExtensions: ['mp4', 'avi', 'rmvb'],
            showPreview: false
        }).on('fileuploaded', function (event, data, previewId, index) {
        	var rsp = data.response;
            if (rsp.code == 0) {
            	$("#videoUrl").val(rsp.fileName);
            } else {
            	$.modal.alertError(rsp.msg);
            }
        }).on('fileremoved', function () {
            $("#videoUrl").val('');
        });

		$("#form-video-add").validate({
			onkeyup: false,
			rules:{
				orderNum:{
					digits:true
				}
			},
		    focusCleanup: true
		});

		function submitHandler() {
			if ($.common.isEmpty($("#videoUrl").val())) {
				$.modal.msgWarning("请先上传视频文件");
				return false;
			}
	        if ($.validate.form()) {
	        	$.operate.save(prefix + "/add", $('#form-video-add').serialize());
	        }
	    }
	</script>
</body>
</html>
