<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
	<th:block th:include="include :: header('修改课程视频')" />
	<th:block th:include="include :: bootstrap-fileinput-css" />
</head>
<body class="white-bg">
	<div class="wrapper wrapper-content animated fadeInRight ibox-content">
		<form class="form-horizontal m" id="form-video-edit" th:object="${video}">
			<input id="videoId" name="videoId" type="hidden" th:field="*{videoId}"/>
			<input id="courseId" name="courseId" type="hidden" th:field="*{courseId}"/>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">视频标题：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" name="videoTitle" id="videoTitle" th:field="*{videoTitle}" required>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">所属章节：</label>
				<div class="col-sm-8">
					<!-- 选「无章节」提交空串，后端绑成 null，服务层会把它更新掉 -->
					<select name="chapterId" class="form-control">
						<option value="">无章节</option>
						<option th:each="c : ${chapters}" th:text="${c.chapterTitle}" th:value="${c.chapterId}"
								th:selected="${c.chapterId == video.chapterId}"></option>
					</select>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">视频文件：</label>
				<div class="col-sm-8">
					<!-- 已有视频时这里是旧地址，重新上传会覆盖；不重新上传就保持原值 -->
					<input type="hidden" id="videoUrl" name="videoUrl" th:field="*{videoUrl}"/>
					<div class="file-loading">
						<input id="videoFile" name="file" type="file">
					</div>
					<div class="help-block" th:if="${video.videoUrl != null and video.videoUrl != ''}">
						当前视频：<a th:href="${video.videoUrl}" target="_blank">播放/下载</a>
					</div>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">显示顺序：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" name="orderNum" id="orderNum" th:field="*{orderNum}">
				</div>
			</div>
		</form>
	</div>
	<th:block th:include="include :: footer" />
	<th:block th:include="include :: bootstrap-fileinput-js" />
	<script type="text/javascript">
		var prefix = ctx + "course/video";

		/* 视频不预览：bootstrap-fileinput 的预览会把整个文件读进浏览器内存，
		   几百 MB 的视频会直接把页面卡死，只留文件名即可 */
		$("#videoFile").fileinput({
            uploadUrl: ctx + 'common/upload',
            maxFileCount: 1,
            autoReplace: true,
            allowedFileExtensions: ['mp4', 'avi', 'rmvb'],
            showPreview: false
        }).on('fileuploaded', function (event, data, previewId, index) {
        	var rsp = data.response;
            if (rsp.code == 0) {
            	$("#videoUrl").val(rsp.fileName);
            } else {
            	$.modal.alertError(rsp.msg);
            }
        });

		$("#form-video-edit").validate({
			onkeyup: false,
			rules:{
				orderNum:{
					digits:true
				}
			},
		    focusCleanup: true
		});

		function submitHandler() {
			if ($.common.isEmpty($("#videoUrl").val())) {
				$.modal.msgWarning("请先上传视频文件");
				return false;
			}
	        if ($.validate.form()) {
	        	$.operate.save(prefix + "/edit", $('#form-video-edit').serialize());
	        }
	    }
	</script>
</body>
</html>
