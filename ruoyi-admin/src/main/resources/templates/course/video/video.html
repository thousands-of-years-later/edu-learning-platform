<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
	<th:block th:include="include :: header('课程视频列表')" />
</head>
<body class="gray-bg">
	<div class="container-div">
		<div class="row">
			<div class="col-sm-12 search-collapse">
				<!-- 第一个 form 会被 bootstrap-table 的默认 queryParams 序列化；
				     courseId 用 th:value 渲染成 HTML 默认值，$.form.reset() 后不会丢 -->
				<form id="video-form">
					<input type="hidden" id="courseId" name="courseId" th:value="${courseId}">
					<div class="select-list">
						<ul>
							<li>
								视频标题：<input type="text" name="videoTitle"/>
							</li>
							<li>
								<a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
							    <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
							</li>
						</ul>
					</div>
				</form>
			</div>

			<div class="btn-group-sm" id="toolbar" role="group">
				<a class="btn btn-success" onclick="addVideo()" shiro:hasPermission="course:course:add">
	                <i class="fa fa-plus"></i> 新增视频
	            </a>
				<a class="btn btn-primary single disabled" onclick="$.operate.edit()" shiro:hasPermission="course:course:edit">
		            <i class="fa fa-edit"></i> 修改
		        </a>
				<a class="btn btn-info" onclick="refreshDurations()" shiro:hasPermission="course:course:edit">
		            <i class="fa fa-clock-o"></i> 刷新时长
		        </a>
				<a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()" shiro:hasPermission="course:course:remove">
		            <i class="fa fa-remove"></i> 删除
		        </a>
		        <a class="btn btn-danger" onclick="closeItem()">
		            <i class="fa fa-reply-all"></i> 关闭
		        </a>
	        </div>

	        <div class="col-sm-12 select-table table-striped">
			    <table id="bootstrap-table"></table>
			</div>
		</div>
	</div>
	<th:block th:include="include :: footer" />
	<script th:inline="javascript">
		var editFlag = /*[[${@permission.hasPermi('course:course:edit')}]]*/ "";
		var removeFlag = /*[[${@permission.hasPermi('course:course:remove')}]]*/ "";
		var prefix = ctx + "course/video";

		/* $.operate.add(id) 只会替换 createUrl 里的 {id}，所以父课程 ID 用路径变量带走 */
		function addVideo() {
			$.operate.add($("#courseId").val());
		}

		function refreshDurations() {
			$.modal.confirm("会分批读取视频真实时长，视频较多时耗时较长，确定继续？", function () {
				var offset = 0, batch = 20, updated = 0, failed = 0, skipped = 0;
				$.modal.loading("正在读取视频时长...");
				function loadNext() {
					$.ajax({
						url: prefix + "/refreshDuration",
						type: "post",
						data: { offset: offset, batch: batch },
						dataType: "json",
						success: function (result) {
							if (result.code !== 0) {
								$.modal.closeLoading();
								$.modal.alertError(result.msg);
								return;
							}
							updated += result.updated || 0;
							failed += result.failed || 0;
							skipped += result.skipped || 0;
							if (result.done) {
								$.modal.closeLoading();
								var msg = "刷新完成：更新 " + updated + " 条，失败 " + failed + " 条，跳过 " + skipped + " 条";
								if (result.failures && result.failures.length > 0) {
									msg += "<br>失败视频：";
									$.each(result.failures, function (i, item) {
										msg += "<br>ID " + item.videoId + "：" + item.videoUrl;
									});
								}
								$.modal.alertSuccess(msg);
								$.table.refresh();
							} else {
								offset = result.nextOffset;
								$.modal.loading("正在读取视频时长（" + offset + "/" + result.total + "）...");
								loadNext();
							}
						},
						error: function () {
							$.modal.closeLoading();
							$.modal.alertError("刷新中断，已更新 " + updated + " 条");
						}
					});
				}
				loadNext();
			});
		}

		$(function() {
		    var options = {
		        url: prefix + "/list",
		        createUrl: prefix + "/add/{id}",
		        updateUrl: prefix + "/edit/{id}",
		        removeUrl: prefix + "/remove",
		        queryParams: queryParams,
		        modalName: "视频",
		        uniqueId: "videoId",
		        sortName: "videoId",
		        columns: [{
		            checkbox: true
		        },
		        {
		            field: 'videoId',
		            title: '视频编号',
		            sortable: true
		        },
		        {
		            field: 'videoTitle',
		            title: '视频标题',
		            sortable: true
		        },
		        {
		            field: 'chapterTitle',
		            title: '所属章节',
		            formatter: function(value, row, index) {
		                return $.common.isEmpty(value) ? '无章节' : value;
		            }
		        },
		        {
		            field: 'videoUrl',
		            title: '视频地址',
		            formatter: function(value, row, index) {
		                if ($.common.isEmpty(value)) {
		                    return '';
		                }
		                return '<a href="' + value + '" target="_blank">播放/下载</a>';
		            }
		        },
		        {
		            field: 'orderNum',
		            title: '显示顺序',
		            sortable: true
		        },
		        {
		            field: 'createTime',
		            title: '创建时间',
		            sortable: true
		        },
		        {
		            title: '操作',
		            align: 'center',
		            formatter: function(value, row, index) {
		                var actions = [];
		                actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.videoId + '\')"><i class="fa fa-edit"></i>编辑</a> ');
		                actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.videoId + '\')"><i class="fa fa-remove"></i>删除</a>');
		                return actions.join('');
		            }
		        }]
		    };
		    $.table.init(options);
		});

		/* 无论分页、排序还是重置，courseId 都必须一直带着，否则会查出全库视频 */
		function queryParams(params) {
			var search = $.table.queryParams(params);
			search.courseId = $("#courseId").val();
			return search;
		}
	</script>
</body>
</html>
