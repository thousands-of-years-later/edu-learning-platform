<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
	<th:block th:include="include :: header('修改商城商品')" />
	<th:block th:include="include :: bootstrap-fileinput-css" />
</head>
<body class="white-bg">
	<div class="wrapper wrapper-content animated fadeInRight ibox-content">
		<form class="form-horizontal m" id="form-shop-product-edit" th:object="${shopProduct}">
			<input id="productId" name="productId" type="hidden" th:field="*{productId}"/>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">商品分类：</label>
				<div class="col-sm-8">
					<!-- 停用的分类也要列出来，否则选不回原值；分类被删后必须重新选一个 -->
					<select name="categoryId" class="form-control" required>
						<option value="">请选择</option>
						<option th:each="c : ${categories}" th:value="${c.categoryId}"
								th:text="${c.status == '1' ? c.categoryName + '（已停用）' : c.categoryName}"
								th:selected="${c.categoryId == shopProduct.categoryId}"></option>
					</select>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">商品名称：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" name="productName" id="productName" th:field="*{productName}" required>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">商品封面：</label>
				<div class="col-sm-8">
					<!-- 已有封面时这里是旧地址，重新上传会覆盖；不清空就保持原值 -->
					<input type="hidden" id="coverUrl" name="coverUrl" th:field="*{coverUrl}"/>
					<div class="file-loading">
						<input id="coverFile" name="file" type="file">
					</div>
					<div class="help-block" th:if="${shopProduct.coverUrl != null and shopProduct.coverUrl != ''}">
						当前封面：<img th:src="${shopProduct.coverUrl}" style="height:40px"/>
					</div>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">兑换积分：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" name="pointsPrice" id="pointsPrice" th:field="*{pointsPrice}" required>
					<div class="help-block">用户兑换时扣减的积分，必须大于 0</div>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">库存：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" name="stock" id="stock" th:field="*{stock}" required>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">显示顺序：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" name="orderNum" id="orderNum" th:field="*{orderNum}">
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">状态：</label>
				<div class="col-sm-8">
					<div class="radio-box" th:each="dict : ${@dict.getType('sys_normal_disable')}">
						<input type="radio" th:id="${dict.dictCode}" name="status" th:value="${dict.dictValue}" th:field="*{status}">
						<label th:for="${dict.dictCode}" th:text="${dict.dictLabel}"></label>
					</div>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">商品描述：</label>
				<div class="col-sm-8">
					<textarea id="description" name="description" class="form-control">[[*{description}]]</textarea>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">备注：</label>
				<div class="col-sm-8">
					<textarea id="remark" name="remark" class="form-control">[[*{remark}]]</textarea>
				</div>
			</div>
		</form>
	</div>
	<th:block th:include="include :: footer" />
	<th:block th:include="include :: bootstrap-fileinput-js" />
	<script type="text/javascript">
		var prefix = ctx + "shop/product";

		$("#coverFile").fileinput({
            uploadUrl: ctx + 'common/upload',
            maxFileCount: 1,
            autoReplace: true,
            allowedFileExtensions: ['jpg', 'jpeg', 'png'],
            showPreview: true
        }).on('fileuploaded', function (event, data, previewId, index) {
        	var rsp = data.response;
            if (rsp.code == 0) {
            	$("#coverUrl").val(rsp.fileName);
            } else {
            	$.modal.alertError(rsp.msg);
            }
        }).on('fileremoved', function () {
            $("#coverUrl").val('');
        });

		$("#form-shop-product-edit").validate({
			onkeyup: false,
			rules:{
				pointsPrice:{
					digits:true,
					min:1
				},
				stock:{
					digits:true,
					min:0
				},
				orderNum:{
					digits:true
				}
			},
		    focusCleanup: true
		});

		function submitHandler() {
			if ($.common.isEmpty($("#coverUrl").val())) {
				$.modal.msgWarning("请先上传商品封面");
				return false;
			}
	        if ($.validate.form()) {
	        	$.operate.save(prefix + "/edit", $('#form-shop-product-edit').serialize());
	        }
	    }
	</script>
</body>
</html>
