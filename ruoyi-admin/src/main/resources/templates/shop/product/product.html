<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
	<th:block th:include="include :: header('商城商品列表')" />
</head>
<body class="gray-bg">
	<div class="container-div">
		<div class="row">
			<div class="col-sm-12 search-collapse">
				<form id="shop-product-form">
					<div class="select-list">
						<ul>
							<li>
								商品名称：<input type="text" name="productName"/>
							</li>
							<li>
								商品分类：<select name="categoryId">
									<option value="">所有</option>
									<option th:each="c : ${categories}" th:text="${c.categoryName}" th:value="${c.categoryId}"></option>
								</select>
							</li>
							<li>
								状态：<select name="status" th:with="type=${@dict.getType('sys_normal_disable')}">
									<option value="">所有</option>
									<option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
								</select>
							</li>
							<li>
								<a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
							    <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
							</li>
						</ul>
					</div>
				</form>
			</div>

			<div class="btn-group-sm" id="toolbar" role="group">
				<a class="btn btn-success" onclick="$.operate.add()" shiro:hasPermission="shop:product:add">
	                <i class="fa fa-plus"></i> 新增
	            </a>
				<a class="btn btn-primary single disabled" onclick="$.operate.edit()" shiro:hasPermission="shop:product:edit">
		            <i class="fa fa-edit"></i> 修改
		        </a>
				<a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()" shiro:hasPermission="shop:product:remove">
		            <i class="fa fa-remove"></i> 删除
		        </a>
	        </div>

	        <div class="col-sm-12 select-table table-striped">
			    <table id="bootstrap-table"></table>
			</div>
		</div>
	</div>
	<th:block th:include="include :: footer" />
	<script th:inline="javascript">
		var editFlag = /*[[${@permission.hasPermi('shop:product:edit')}]]*/ "";
		var removeFlag = /*[[${@permission.hasPermi('shop:product:remove')}]]*/ "";
		var datas = /*[[${@dict.getType('sys_normal_disable')}]]*/ [];
		var prefix = ctx + "shop/product";

		$(function() {
		    var options = {
		        url: prefix + "/list",
		        createUrl: prefix + "/add",
		        updateUrl: prefix + "/edit/{id}",
		        removeUrl: prefix + "/remove",
		        sortName: "orderNum",
		        modalName: "商品",
		        uniqueId: "productId",
		        columns: [{
		            checkbox: true
		        },
		        {
		            field: 'productId',
		            title: '商品编号'
		        },
		        {
		            field: 'coverUrl',
		            title: '封面',
		            align: 'center',
		            formatter: function(value, row, index) {
		                return $.common.isEmpty(value) ? '<span class="text-muted">无</span>' : $.table.imageView(value, 40, 40);
		            }
		        },
		        {
		            field: 'productName',
		            title: '商品名称',
		            sortable: true
		        },
		        {
		            field: 'categoryName',
		            title: '商品分类'
		        },
		        {
		            field: 'pointsPrice',
		            title: '兑换积分',
		            sortable: true
		        },
		        {
		            field: 'stock',
		            title: '库存',
		            sortable: true
		        },
		        {
		            field: 'soldCount',
		            title: '已兑换',
		            sortable: true
		        },
		        {
		            field: 'orderNum',
		            title: '显示顺序',
		            sortable: true
		        },
		        {
		            field: 'status',
		            title: '状态',
		            align: 'center',
		            formatter: function(value, row, index) {
		            	return $.table.selectDictLabel(datas, value);
		            }
		        },
		        {
		            field: 'createTime',
		            title: '创建时间',
		            sortable: true
		        },
		        {
		            title: '操作',
		            align: 'center',
		            formatter: function(value, row, index) {
		                var actions = [];
		                actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.productId + '\')"><i class="fa fa-edit"></i>编辑</a> ');
		                actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.productId + '\')"><i class="fa fa-remove"></i>删除</a>');
		                return actions.join('');
		            }
		        }]
		    };
		    $.table.init(options);
		});
	</script>
</body>
</html>
