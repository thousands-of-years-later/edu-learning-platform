<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
	<th:block th:include="include :: header('修改平台协议')" />
	<th:block th:include="include :: summernote-css" />
</head>
<body class="white-bg">
	<div class="wrapper wrapper-content animated fadeInRight ibox-content">
		<form class="form-horizontal m" id="form-agreement-edit" th:object="${agreement}">
			<input id="agreementId" name="agreementId" th:field="*{agreementId}" type="hidden">
			<div class="form-group">
				<label class="col-sm-2 control-label is-required">协议类型：</label>
				<div class="col-sm-10">
					<select id="agreementType" name="agreementType" class="form-control" required>
						<option th:each="t : ${agreementTypes}" th:text="${t.label}" th:value="${t.value}"
								th:selected="${t.value == agreement.agreementType}"></option>
					</select>
					<div class="help-block">每种类型只能有一条未删除的记录</div>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-2 control-label is-required">标题：</label>
				<div class="col-sm-10">
					<input id="title" name="title" class="form-control" type="text" th:field="*{title}" required>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-2 control-label is-required">协议内容：</label>
				<div class="col-sm-10">
					<!-- 正文 HTML 先放在隐藏域里，页面加载后再灌进 summernote（与通知公告编辑页一致） -->
					<input id="content" name="content" th:field="*{content}" type="hidden">
					<div class="summernote"></div>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-2 control-label">显示顺序：</label>
				<div class="col-sm-10">
					<input class="form-control" type="text" name="orderNum" id="orderNum" th:field="*{orderNum}">
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-2 control-label">状态：</label>
				<div class="col-sm-10">
					<div class="radio-box" th:each="dict : ${@dict.getType('sys_normal_disable')}">
						<input type="radio" th:id="${dict.dictCode}" name="status" th:value="${dict.dictValue}" th:field="*{status}">
						<label th:for="${dict.dictCode}" th:text="${dict.dictLabel}"></label>
					</div>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-2 control-label">备注：</label>
				<div class="col-sm-10">
					<textarea id="remark" name="remark" class="form-control">[[*{remark}]]</textarea>
				</div>
			</div>
		</form>
	</div>
	<th:block th:include="include :: footer" />
	<th:block th:include="include :: summernote-js" />
	<script type="text/javascript">
		var prefix = ctx + "user/agreement";

		$(function() {
			$('.summernote').summernote({
				placeholder: '请输入协议内容',
				height: 320,
				lang: 'zh-CN',
				followingToolbar: false,
				dialogsInBody: true,
				callbacks: {
					onImageUpload: function (files) {
						sendFile(files[0], this);
					}
				}
			});
			// 隐藏域里的 value 已被浏览器解码回原始 HTML
			var content = $("#content").val();
			$('.summernote').summernote('code', content);
		});

		// 上传图片（与通知公告一致，走 common/upload）
		function sendFile(file, obj) {
			var data = new FormData();
			data.append("file", file);
			$.ajax({
				type: "POST",
				url: ctx + "common/upload",
				data: data,
				cache: false,
				contentType: false,
				processData: false,
				dataType: 'json',
				success: function(result) {
					if (result.code == web_status.SUCCESS) {
						$(obj).summernote('editor.insertImage', result.url, result.fileName);
					} else {
						$.modal.alertError(result.msg);
					}
				},
				error: function(error) {
					$.modal.alertWarning("图片上传失败。");
				}
			});
		}

		$("#form-agreement-edit").validate({
			onkeyup: false,
			rules:{
				agreementType:{
					remote: {
		                url: ctx + "user/agreement/checkTypeUnique",
		                type: "post",
		                dataType: "json",
		                data: {
		                	"agreementType" : function() {
		                        return $("#agreementType").val();
		                    },
		                    "agreementId" : function() {
		                        return $("#agreementId").val();
		                    }
		                }
		            }
				},
				orderNum:{
					digits:true
				}
			},
			messages: {
		        "agreementType": {
		            remote: "该类型的协议已存在，请直接编辑已有记录"
		        }
		    },
		    focusCleanup: true
		});

		function submitHandler() {
			var sHTML = $('.summernote').summernote('code');
			// 空编辑器会返回 <p><br></p>，去掉标签后没有文字且不含图片才算空
			var text = sHTML.replace(/<[^>]*>/g, '').replace(/&nbsp;/g, '').trim();
			if (text === '' && sHTML.indexOf('<img') === -1) {
				$.modal.msgWarning("请输入协议内容");
				return false;
			}
			$("#content").val(sHTML);
	        if ($.validate.form()) {
	        	$.operate.save(prefix + "/edit", $('#form-agreement-edit').serialize());
	        }
	    }
	</script>
</body>
</html>
