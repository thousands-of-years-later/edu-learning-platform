<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
	<th:block th:include="include :: header('积分流水')" />
</head>
<body class="gray-bg">
	<div class="container-div">
		<div class="row">
			<div class="col-sm-12 search-collapse">
				<form id="log-form">
					<div class="select-list">
						<ul>
							<li>
								用户昵称：<input type="text" name="userName"/>
							</li>
							<li>
								类型：<select name="type">
									<option value="">所有</option>
									<option value="checkin">签到</option>
									<option value="exchange">兑换</option>
									<option value="adjust">手工调整</option>
								</select>
							</li>
							<li>
								<a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
							    <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
							</li>
						</ul>
					</div>
				</form>
			</div>

			<div class="btn-group-sm" id="toolbar" role="group">
				<a class="btn btn-default" href="/user/points/account"><i class="fa fa-user"></i> 查看积分账户</a>
	        </div>

	        <div class="col-sm-12 select-table table-striped">
			    <table id="bootstrap-table"></table>
			</div>
		</div>
	</div>
	<th:block th:include="include :: footer" />
	<script th:inline="javascript">
		var prefix = ctx + "user/points";

		$(function() {
		    var options = {
		        url: prefix + "/log/list",
		        modalName: "积分流水",
		        uniqueId: "logId",
		        sortName: "logId",
		        columns: [{
		            field: 'logId',
		            title: '流水ID',
		            sortable: true
		        },
		        {
		            field: 'userName',
		            title: '用户'
		        },
		        {
		            field: 'type',
		            title: '类型',
		            align: 'center',
		            formatter: function(value, row, index) {
		                if (value === 'checkin') { return '<span class="label label-success">签到</span>'; }
		                if (value === 'exchange') { return '<span class="label label-warning">兑换</span>'; }
		                if (value === 'adjust') { return '<span class="label label-info">调整</span>'; }
		                return value;
		            }
		        },
		        {
		            field: 'changeAmount',
		            title: '变动',
		            align: 'center',
		            formatter: function(value, row, index) {
		                if (value == null) { return ''; }
		                return value >= 0 ? '<span class="text-success">+' + value + '</span>'
		                                  : '<span class="text-danger">' + value + '</span>';
		            }
		        },
		        {
		            field: 'balance',
		            title: '变动后余额',
		            align: 'center'
		        },
		        {
		            field: 'remark',
		            title: '备注'
		        },
		        {
		            field: 'createTime',
		            title: '时间',
		            sortable: true
		        }]
		    };
		    $.table.init(options);
		});
	</script>
</body>
</html>
