<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
	<th:block th:include="include :: header('积分记录')" />
</head>
<body class="gray-bg">
	<div class="container-div">
		<div class="row">
			<div class="col-sm-12 search-collapse">
				<form id="points-form">
					<div class="select-list">
						<ul>
							<li>
								用户昵称：<input type="text" name="userName"/>
							</li>
							<li>
								<a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
							    <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
							</li>
						</ul>
					</div>
				</form>
			</div>

			<div class="col-sm-12 select-table table-striped">
			    <table id="bootstrap-table"></table>
			</div>
		</div>
	</div>
	<th:block th:include="include :: footer" />
	<script th:inline="javascript">
		var prefix = ctx + "user/points";

		/* 打开某个用户的积分明细：来源 + 每次积分变动 + 变动后余额 */
		function openDetail(userId) {
			$.modal.openTab("积分明细", ctx + "user/points/detail?userId=" + userId);
		}

		$(function() {
		    var options = {
		        url: prefix + "/list",
		        modalName: "积分记录",
		        uniqueId: "userId",
		        sortName: "userId",
		        columns: [{
		            field: 'userId',
		            title: '用户ID',
		            sortable: true
		        },
		        {
		            field: 'userName',
		            title: '用户'
		        },
		        {
		            field: 'balance',
		            title: '总积分',
		            align: 'center',
		            sortable: true,
		            formatter: function(value, row, index) {
		                if (value == null) { return '0'; }
		                return '<span class="label label-success">' + value + '</span>';
		            }
		        },
		        {
		            field: 'totalEarned',
		            title: '累计获得',
		            align: 'center'
		        },
		        {
		            field: 'updateTime',
		            title: '最后变动',
		            sortable: true
		        },
		        {
		            title: '操作',
		            align: 'center',
		            formatter: function(value, row, index) {
		                return '<a class="btn btn-info btn-xs" href="javascript:void(0)" onclick="openDetail(\'' + row.userId + '\')"><i class="fa fa-list"></i>查看明细</a>';
		            }
		        }]
		    };
		    $.table.init(options);
		});
	</script>
</body>
</html>
