<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
	<th:block th:include="include :: header('短视频列表')" />
</head>
<body class="gray-bg">
	<div class="container-div">
		<div class="row">
			<div class="col-sm-12 search-collapse">
				<form id="shortvideo-form">
					<div class="select-list">
						<ul>
							<li>
								视频标题：<input type="text" name="videoTitle"/>
							</li>
							<li>
								状态：<select name="status" th:with="type=${@dict.getType('sys_video_status')}">
									<option value="">所有</option>
									<option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
								</select>
							</li>
							<li>
								<a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
							    <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
							</li>
						</ul>
					</div>
				</form>
			</div>

			<div class="btn-group-sm" id="toolbar" role="group">
				<a class="btn btn-success" onclick="$.operate.add()" shiro:hasPermission="video:shortvideo:add">
	                <i class="fa fa-plus"></i> 新增
	            </a>
				<a class="btn btn-primary single disabled" onclick="$.operate.edit()" shiro:hasPermission="video:shortvideo:edit">
		            <i class="fa fa-edit"></i> 修改
		        </a>
				<a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()" shiro:hasPermission="video:shortvideo:remove">
		            <i class="fa fa-remove"></i> 删除
		        </a>
				<a class="btn btn-warning" onclick="$.table.exportExcel()" shiro:hasPermission="video:shortvideo:export">
		            <i class="fa fa-download"></i> 导出
		        </a>
	        </div>

	        <div class="col-sm-12 select-table table-striped">
			    <table id="bootstrap-table"></table>
			</div>
		</div>
	</div>
	<th:block th:include="include :: footer" />
	<script th:inline="javascript">
		var editFlag = /*[[${@permission.hasPermi('video:shortvideo:edit')}]]*/ "";
		var removeFlag = /*[[${@permission.hasPermi('video:shortvideo:remove')}]]*/ "";
		var datas = /*[[${@dict.getType('sys_video_status')}]]*/ [];
		var prefix = ctx + "video/shortvideo";

		/* 评论查看：从短视频行内进入，展示视频信息 + 评论 + 回复 */
		function openComments(videoId) {
			$.modal.openTab("短视频评论", ctx + "community/comment/view?targetType=3&targetId=" + videoId);
		}

		/* 播放：弹层直接播 OSS 上的视频 */
		function playVideo(videoUrl, videoTitle) {
			if (!videoUrl) {
				$.modal.alertWarning("该短视频没有视频地址");
				return;
			}
			layer.open({
				type: 1,
				title: videoTitle || "视频播放",
				area: ['820px', '520px'],
				content: '<div style="width:100%;height:100%;background:#000;">'
					+ '<video src="' + escAttr(videoUrl) + '" controls autoplay style="width:100%;height:100%;"></video></div>'
			});
		}

		/* 转义：地址/标题里带引号也不会把 onclick 拼坏 */
		function escAttr(text) {
			return String(text == null ? '' : text)
				.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
		}

		$(function() {
		    var options = {
		        url: prefix + "/list",
		        createUrl: prefix + "/add",
		        updateUrl: prefix + "/edit/{id}",
		        removeUrl: prefix + "/remove",
		        exportUrl: prefix + "/export",
		        modalName: "短视频",
		        uniqueId: "videoId",
		        sortName: "videoId",
		        columns: [{
		            checkbox: true
		        },
		        {
		            field: 'videoId',
		            title: '视频编号',
		            sortable: true
		        },
		        {
		            field: 'coverUrl',
		            title: '封面',
		            align: 'center',
		            formatter: function(value, row, index) {
		                return $.table.imageView(value, 60, 40);
		            }
		        },
		        {
		            field: 'videoTitle',
		            title: '视频标题',
		            sortable: true
		        },
		        {
		            field: 'intro',
		            title: '简介'
		        },
		        {
		            field: 'duration',
		            title: '时长(秒)',
		            align: 'center',
		            formatter: function(value, row, index) {
		                if (value == null) { return ''; }
		                var m = Math.floor(value / 60);
		                var s = value % 60;
		                return (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
		            }
		        },
		        {
		            field: 'viewCount',
		            title: '播放',
		            align: 'center'
		        },
		        {
		            field: 'likeCount',
		            title: '点赞',
		            align: 'center'
		        },
		        {
		            field: 'favoriteCount',
		            title: '收藏',
		            align: 'center'
		        },
		        {
		            field: 'commentCount',
		            title: '评论',
		            align: 'center'
		        },
		        {
		            field: 'userName',
		            title: '上传者'
		        },
		        {
		            field: 'status',
		            title: '状态',
		            align: 'center',
		            formatter: function(value, row, index) {
		            	return $.table.selectDictLabel(datas, value);
		            }
		        },
		        {
		            field: 'createTime',
		            title: '创建时间',
		            sortable: true
		        },
		        {
		            title: '操作',
		            align: 'center',
		            formatter: function(value, row, index) {
		                var actions = [];
		                actions.push('<a class="btn btn-primary btn-xs" href="javascript:void(0)" onclick="playVideo(\'' + escAttr(row.videoUrl || '') + '\',\'' + escAttr(row.videoTitle || '') + '\')"><i class="fa fa-play"></i>播放</a> ');
		                actions.push('<a class="btn btn-info btn-xs" href="javascript:void(0)" onclick="openComments(\'' + row.videoId + '\')"><i class="fa fa-comments"></i>评论</a> ');
		                actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.videoId + '\')"><i class="fa fa-edit"></i>编辑</a> ');
		                actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.videoId + '\')"><i class="fa fa-remove"></i>删除</a>');
		                return actions.join('');
		            }
		        }]
		    };
		    $.table.init(options);
		});
	</script>
</body>
</html>
